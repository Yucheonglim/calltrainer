plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.company.calltrainer'
    compileSdk 34

    defaultConfig {
        // 삼성/구글 블랙리스트 기록을 완전히 초기화하기 위해 새 ID 부여
        applicationId "com.edgesecure.teamcall.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
